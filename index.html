<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>2048</h1>
        <p class="hint">方向键 / WASD，手机端滑动</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">得分</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">最高</span>
          <span id="best" class="score-value">0</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <button id="new-game" type="button">新游戏</button>
      <button id="undo" type="button" disabled>撤销</button>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="2048 棋盘" role="grid"></div>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-text">游戏结束</p>
        <button id="overlay-restart" type="button">再来一局</button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
